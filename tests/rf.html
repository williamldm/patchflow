<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Tests RF</title>
<style>body{font:14px/1.5 system-ui,sans-serif;margin:24px;max-width:900px}h1{font-size:18px}.ok{color:#067647}.ko{color:#d92d20;font-weight:600}li{margin:2px 0}pre{background:#f4f5f7;padding:8px;border-radius:6px;white-space:pre-wrap}</style>
</head><body>
<h1>PatchFlow — tests du module RF</h1>
<p>Lecture des shows Wireless Workbench, table des bandes, fusion, contrôles et recoupement avec l'input list. Sessions synthétiques (<code>rf-fixtures.js</code>).</p>
<p id="sum"></p><ul id="log"></ul>
<script src="../pf-rf.js"></script>
<script src="rf-fixtures.js"></script>
<script>
(function(){
  var log = document.getElementById('log'), pass = 0, failN = 0, lines = [];
  function t(name, cond, detail){
    if(cond) pass++; else failN++;
    lines.push((cond ? 'OK   ' : 'FAIL ') + name + (cond || detail === undefined ? '' : ' → ' + JSON.stringify(detail)));
    var li = document.createElement('li'); li.className = cond ? 'ok' : 'ko';
    li.textContent = (cond ? '✓ ' : '✗ ') + name + (cond || detail === undefined ? '' : ' → ' + JSON.stringify(detail));
    log.appendChild(li);
  }
  function eq(name, a, b){ t(name, JSON.stringify(a) === JSON.stringify(b), { obtenu:a, attendu:b }); }
  var F = RF_FIX;
  try {
    /* 1. Lecture d'un show */
    var p = _rfParseShw(F.festival);
    t('show lu', p.ok === true, p.err);
    eq('nom et version', [p.show.name, p.show.app], ['Festival Test', '7.8.0.66']);
    eq('7 canaux, 1 appareil sans canal ignoré', [p.ch.length, p.skipped], [7, 1]);
    eq('zones', p.zones, ['Plateau', 'Accueil']);
    eq('zones isolées', p.iso, [['Plateau', 'Accueil'], ['Accueil', 'Plateau']]);
    var by = {}; p.ch.forEach(function(c){ by[c.n + '|' + c.dev] = c; });
    var lead = p.ch[0], gtr = p.ch[2], iem = p.ch[3], spk = p.ch[5];
    eq('canal 1 : nom CDATA, inventaire, coordination, espacement', [lead.n, lead.fi, lead.fc, lead.sp, lead.kind, lead.band], ['Lead Vox', 470150, 511475, 350, 'mic', 'G56']);
    eq('identifiant source à deux canaux', [p.ch[0].src, p.ch[1].src], ['AAAA0001-0', 'AAAA0001-1']);
    eq('appareil à un canal : identifiant sans suffixe ; profil retrouvé par série et bande', [gtr.src, gtr.fc, gtr.sp], ['AAAA0002', 611250, 350]);
    eq('IEM reconnu, puissance', [iem.kind, iem.pw, iem.fc], ['iem', 10, 630000]);
    eq('Sennheiser : fabricant, groupe/canal', [spk.mk, spk.gc, spk.kind], ['Sennheiser', 'G:1 Ch:3', 'iem']);
    eq('canal sans coordination : SR sans entrée reste IEM par sa série', [p.ch[6].fc, p.ch[6].kind], [0, 'iem']);
    eq('groupe/canal vide ignoré', lead.gc, '');
    eq('réserve', p.spare, [{ f:540475, ser:'AD', band:'G56', zone:'Plateau' }]);
    eq('exclusions actives seulement', p.excl, [{ a:480000, b:488000, l:'DVB local' }, { a:542000, b:550000, l:'TV 30' }]);
    eq('coordination proposée', [p.coordDiff, p.suggest], [6, 'coord']);
    eq('show déployé : inventaire proposé', _rfParseShw(F.festival2).suggest, 'inv');

    /* 2. Fichiers refusés */
    var bad = [['vide', ''], ['texte', 'bonjour'], ['autre XML', '<root><inventory/></root>'], ['sans inventaire', '<show><x/></show>'],
               ['inventaire vide', F.show({ devices:[] })], ['archive', 'PK\x03\x04 <show><inventory>'], ['XML tronqué', F.festival.slice(0, 900)], ['nombre', 12]];
    bad.forEach(function(b){ var r = _rfParseShw(b[1]); t('refusé : ' + b[0], r.ok === false && typeof r.err === 'string' && r.err.length > 8, r); });

    /* 3. Bandes */
    eq('AD G56', _rfBand('AD', 'G56'), [470150, 636000]);
    eq('EM 2050 Gw', _rfBand('EM 2050', 'Gw'), [558000, 626000]);
    eq('PSM1000 L8E', _rfBand('PSM1000', 'L8E'), [626125, 697875]);
    eq('bande inconnue', _rfBand('AD', 'ZZ9'), null);
    eq('série inconnue', _rfBand('Lectro', 'A1'), null);

    /* 4. Fréquences saisies */
    eq('saisie MHz', ['606.125', '606,125', ' 606.5 MHz', '606125', '1800', 'abc', '', '12', '606.1.2'].map(_rfParseMHz), [606125, 606125, 606500, 606125, 1800000, 0, 0, 0, 0]);
    eq('affichage', [_rfFmt(606125), _rfFmt(0)], ['606.125', '']);

    /* 5. Fusion */
    var m1 = _rfMerge([], p, { mode:'coord' });
    eq('premier import', [m1.add, m1.upd, m1.same, m1.gone, m1.ch.length], [7, 0, 0, 0, 7]);
    eq('mode coordination', [m1.ch[0].f, m1.ch[6].f], [511475, 558000]);
    eq('mode inventaire', _rfMerge([], p, { mode:'inv' }).ch[0].f, 470150);
    var cur = JSON.parse(JSON.stringify(m1.ch));
    cur[0].who = 'Camille'; cur[0].tx = 'hh'; cur[0].st = 'ok'; cur[0].note = 'capsule KSM9'; cur[0].il = 'row-12';
    cur[1].n = 'Choeur cour';                                   /* nom retouché dans PatchFlow */
    var p2 = _rfParseShw(F.festival2), m2 = _rfMerge(cur, p2, { mode:'inv' });
    eq('réimport : comptes', [m2.add, m2.upd, m2.same, m2.gone, m2.ch.length], [2, 1, 3, 3, 9]);
    var l2 = m2.ch[0];
    eq('réimport : saisies conservées, fréquence du fichier', [l2.id === cur[0].id, l2.who, l2.tx, l2.st, l2.note, l2.il, l2.f], [true, 'Camille', 'hh', 'ok', 'capsule KSM9', 'row-12', 513000]);
    eq('réimport : nom retouché gardé', m2.ch[1].n, 'Choeur cour');
    t('réimport : la différence cite l\'ancienne et la nouvelle fréquence', m2.diffs.length === 1 && /511\.475 → 513\.000/.test(m2.diffs[0].what.join(' ')), m2.diffs);
    eq('réimport avec retrait des absents', _rfMerge(cur, p2, { mode:'inv', drop:true }).ch.length, 6);
    var manual = [{ id:'rabc12', src:'', n:'Lead Vox', n0:'Lead Vox', mdl:'AD4D-A', who:'Zoé', f:500000, kind:'mic', st:'todo' }];
    eq('sans identifiant : rapproché par nom et modèle', _rfMerge(manual, p, { mode:'coord' }).ch[0].who, 'Zoé');

    /* 6. Contrôles */
    var mk = function(o){ return _rfCleanCh(Object.assign({ id:_rfId(), kind:'mic', st:'ok', who:'x', n:'Canal ' + Math.random().toString(36).slice(2, 6) }, o)); };
    var codes = function(rf, il){ return _rfChecks(rf, il).map(function(a){ return a.lvl + ':' + a.code; }); };
    eq('aucune alerte', codes({ ch:[mk({ f:600000, sp:350 }), mk({ f:600400, sp:350 })] }), []);
    eq('doublon', codes({ ch:[mk({ f:600000 }), mk({ f:600000 })] }), ['err:dup']);
    eq('doublon ignoré entre zones isolées', codes({ ch:[mk({ f:600000, zone:'A' }), mk({ f:600000, zone:'B' })], iso:[['A', 'B']] }), []);
    eq('4 canaux sur la même fréquence : une seule alerte', codes({ ch:[1, 2, 3, 4].map(function(){ return mk({ f:470150 }); }) }), ['err:dup']);
    eq('trop proches selon le profil', codes({ ch:[mk({ f:600000, sp:350 }), mk({ f:600200, sp:350 })] }), ['warn:near']);
    eq('sans profil : pas de contrôle d\'écart', codes({ ch:[mk({ f:600000 }), mk({ f:600200 })] }), []);
    eq('hors plage', codes({ ch:[mk({ f:640000, ser:'AD', band:'G56' })] }), ['err:range']);
    eq('bande inconnue : pas d\'alerte de plage', codes({ ch:[mk({ f:900000, ser:'AD', band:'ZZ9' })] }), []);
    eq('plage exclue', codes({ ch:[mk({ f:484000 })], excl:[{ a:480000, b:488000, l:'DVB' }] }), ['warn:excl']);
    eq('problème, sans fréquence, sans utilisateur, sans nom', codes({ ch:[mk({ f:0, st:'pb', who:'', n:'Shure' })] }), ['warn:pb', 'warn:nofreq', 'info:nowho', 'info:noname']);
    var il = { chs:[{ id:'i1', ch:12, name:'Lead', mic:'SM58 HF', hf:'606.000' }, { id:'i2', ch:13, name:'Gtr', mic:'ULXD1', hf:'' }, { id:'i3', ch:14, name:'Kick', mic:'Beta 52', hf:'' }], outs:[{ id:'o1', ch:1, name:'IEM Lead', hf:'630.000' }] };
    eq('input list : fréquence différente, micro HF orphelin', codes({ ch:[mk({ f:611250, il:'i1' }), mk({ f:630000, kind:'iem', out:'o1' })] }, il), ['warn:ilf', 'info:ilhf']);
    eq('input list : ligne supprimée', codes({ ch:[mk({ f:611250, il:'zz' })] }, { chs:[], outs:[] }), ['info:lost']);
    t('le message nomme les deux canaux', /« A » et « B »/.test(_rfChecks({ ch:[mk({ f:600000, n:'A' }), mk({ f:600000, n:'B' })] })[0].msg));

    /* 7. Rapprochement par nom */
    var prop = _rfMatchIl([mk({ id:'ra0001', who:'Lead', n:'x1' }), mk({ id:'ra0002', who:'', n:'IEM Lead', kind:'iem' }), mk({ id:'ra0003', who:'Inconnu', n:'y' })], il);
    eq('propositions sûres uniquement', prop.map(function(x){ return [x.id, x.to, x.out]; }), [['ra0001', 'i1', false], ['ra0002', 'o1', true]]);
    eq('nom ambigu : aucune proposition', _rfMatchIl([mk({ who:'Vox' })], { chs:[{ id:'a', ch:1, name:'Vox' }, { id:'b', ch:2, name:'Vox' }], outs:[] }).length, 0);

    /* 8. Données stockées abîmées */
    eq('nettoyage : entrée quelconque', _rfClean('x').ch.length, 0);
    var dirty = _rfClean({ ch:[{ id:'<img>', n:'<b>x</b>'.repeat(40), f:'abc', kind:'zz', st:'??', pw:-4 }, { id:'rsame1', f:600000 }, { id:'rsame1', f:601000 }, null], excl:[{ a:5, b:1 }], vers:'x', zones:[3, '', 'A'] });
    eq('nettoyage : champs bornés', [dirty.ch.length, /^[a-z0-9]{4,24}$/.test(dirty.ch[0].id), dirty.ch[0].n.length, dirty.ch[0].f, dirty.ch[0].kind, dirty.ch[0].st, dirty.ch[0].pw], [3, true, 60, 0, 'mic', 'todo', 0]);
    t('nettoyage : identifiants uniques', dirty.ch[1].id !== dirty.ch[2].id);
    eq('nettoyage : exclusions et zones', [dirty.excl.length, dirty.zones], [0, ['3', 'A']]);

    /* 9. Niveaux de compatibilité par famille d'appareils (valeurs des profils Wireless Workbench 7) */
    var pvw = function(c){ var q = _rfProf(c, c.cm); return [q.cc, q.i3, q.i5, q.t3, q.w]; };
    var pv = function(ser, lvl, sp){ var p = _rfProf({ ser:ser, sp:sp || 0 }, lvl); return [p.cc, p.i3, p.i5, p.t3]; };
    eq('AD : robuste, standard, plus de fréquences', [pv('AD', 'rob'), pv('AD', 'std'), pv('AD', 'more')], [[350, 150, 0, 0], [350, 75, 0, 0], [350, 0, 0, 0]]);
    eq('ULXD et QLXD comme AD', [pv('ULXD', 'std'), pv('QLXD', 'rob')], [[350, 75, 0, 0], [350, 150, 0, 0]]);
    eq('PSM1000', [pv('PSM1000', 'rob'), pv('PSM1000', 'std'), pv('PSM1000', 'more')], [[375, 275, 0, 100], [350, 250, 0, 50], [325, 225, 0, 0]]);
    eq('Axient PSM large bande', pv('ADPSM', 'std'), [800, 500, 0, 0]);
    eq('UHF-R', pv('UHFR', 'std'), [325, 175, 0, 50]);
    eq('Sennheiser 2000 : micro et IEM', [pv('EM 2050', 'rob'), pv('EM 2050', 'std'), pv('SR 2050', 'std')], [[600, 200, 150, 150], [400, 200, 0, 150], [500, 200, 0, 200]]);
    eq('Sennheiser 6000', [pv('EM 6000', 'rob'), pv('EM 6000', 'std')], [[500, 50, 25, 25], [400, 0, 0, 0]]);
    eq('appareil inconnu : générique, écart de la session retenu s\'il est plus grand', [_rfProf({ ser:'Lectro' }, 'std').fam, pv('Lectro', 'std'), pv('Lectro', 'std', 600)[0], pv('AD', 'std', 600)[0]], ['gen', [375, 200, 0, 50], 600, 350]);
    eq('niveau inconnu : standard', pv('AD', 'zz'), [350, 75, 0, 0]);
    eq('fenêtre du filtre selon la famille et le niveau', [_rfProf({ ser:'AD' }, 'rob').w, _rfProf({ ser:'AD' }, 'more').w, _rfProf({ ser:'PSM1000' }, 'std').w, _rfProf({ ser:'ADPSM' }, 'std').w, _rfProf({ ser:'UHFR' }, 'std').w, _rfProf({ ser:'ULXD' }, 'std').w], [90000, 55000, 62000, 28000, 25000, 100000]);

    /* 10. Canaux TV, inclusions, exclusions */
    eq('plages saisies', _rfParseRanges('470-478 ; 518,5 à 526, 600-590, abc'), [[470000, 478000], [518500, 526000]]);
    eq('canaux TV de 8 MHz', [_rfTvRange(21, 8), _rfTvRange(48, 8), _rfTvList(8).length], [[470000, 478000], [686000, 694000], 28]);
    eq('canaux TV de 6 MHz', [_rfTvRange(14, 6), _rfTvRange(36, 6), _rfTvList(6).length], [[470000, 476000], [602000, 608000], 23]);
    var avd = { excl:[{ a:480000, b:488000, l:'DVB' }], coord:{ sx:true, tv:[30], tvw:8, rules:[{ t:'ex', a:600000, b:601000 }, { t:'in', a:500000, b:560000 }] } };
    eq('à éviter : session, TV, exclusion ; inclusion à part', [_rfAvoid(avd).ban.map(function(x){ return x.l + ' ' + x.a; }), _rfAvoid(avd).inc], [['DVB 480000', 'TV 30 542000', 'plage exclue 600000'], [[500000, 560000]]]);
    avd.coord.sx = false;
    eq('exclusions de la session désactivables', _rfAvoid(avd).ban.length, 2);
    eq('réglages nettoyés', _rfClean({ coord:{ mode:'zz', dir:'down', lo:900000, hi:100, tv:[21, 21, 99, '30'], tvw:8, sx:false, rules:[{ t:'in', a:500000, b:510000 }, { t:'x', a:5, b:1 }] } }).coord,
      { mode:'std', dir:'down', lo:470000, hi:694000, tv:[21, 30], tvw:8, sx:false, rules:[{ t:'in', a:500000, b:510000 }] });
    eq('ancien champ « à éviter » repris en exclusions', _rfClean({ coord:{ avoid:'470-478' } }).coord.rules, [{ t:'ex', a:470000, b:478000 }]);
    eq('réglages par défaut', _rfClean({}).coord, { mode:'std', dir:'up', lo:470000, hi:694000, tv:[], tvw:8, sx:true, rules:[] });
    eq('niveau et sens d\'une liaison', [_rfCleanCh({ cm:'rob', cd:'down' }).cm, _rfCleanCh({ cm:'rob', cd:'down' }).cd, _rfCleanCh({ cm:'x', cd:1 }).cm, _rfCleanCh({ cm:'x', cd:1 }).cd], ['rob', 'down', '', '']);
    eq('contrôle : fréquence dans un canal TV à éviter', codes({ ch:[mk({ f:545000 })], coord:{ tv:[30], tvw:8 } }), ['warn:excl']);
    eq('contrôle : fréquence hors des inclusions', codes({ ch:[mk({ f:600000 })], coord:{ rules:[{ t:'in', a:500000, b:560000 }] } }), ['warn:incl']);
    eq('show sans format TV : canaux de 8 MHz', p.tvw, 8);
    eq('niveau repris du profil choisi dans WWB ; profil modifié ou personnalisé : ses propres écarts', [p.ch[0].lv, p.ch[2].lv, p.ch[3].lv, p.ch[3].pf, p.ch[5].lv, p.ch[5].pf, p.ch[6].lv], ['std', 'rob', 'wwb', [325, 0, 0, 0, 100], 'wwb', [325, 0, 0, 0, 100], '']);
    eq('profil du show appliqué tel quel', [m1.ch[5].cm, pvw(m1.ch[5]), _rfCleanCh({ cm:'wwb' }).cm], ['wwb', [325, 0, 0, 0, 100000], '']);
    eq('niveau porté sur le canal importé, gardé s\'il a été réglé à la main', [m1.ch[2].cm, _rfMerge([Object.assign({}, m1.ch[2], { cm:'more' })], p, { mode:'coord' }).ch[2].cm], ['rob', 'more']);

    /* 11. Détection des conflits : chaque liaison est jugée à son propre niveau */
    var C = function(id, f, ser, lvl){ return { id:id, f:f, p:_rfProf({ ser:ser }, lvl) }; };
    var ty = function(l){ return _rfCompat(l).list.map(function(x){ return x.t; }).sort().filter(function(v, q, a){ return a.indexOf(v) === q; }).join(','); };
    eq('compatibles', ty([C('a', 500000, 'X', 'std'), C('b', 500400, 'X', 'std'), C('c', 501300, 'X', 'std')]), '');
    eq('porteuses trop proches', ty([C('a', 500000, 'X', 'std'), C('b', 500300, 'X', 'std')]), 'cc');
    eq('deux AD à 500 kHz : compatibles', ty([C('a', 500000, 'AD', 'std'), C('b', 500500, 'AD', 'std')]), '');
    eq('AD et Sennheiser robuste à 500 kHz : le plus grand écart s\'applique', ty([C('a', 500000, 'AD', 'std'), C('b', 500500, 'EM 2050', 'rob')]), 'cc');
    var im = function(lvl){ return _rfCompat([C('a', 500000, 'AD', 'more'), C('b', 501000, 'AD', 'more'), C('c', 499060, 'AD', lvl)]).list.map(function(x){ return x.t + '>' + x.v; }); };
    eq('ordre 3 : seul le canal protégé à ce niveau est gêné', [im('std'), im('more')], [['i3>c'], []]);
    var i5 = function(lvl){ return ty([C('a', 500000, 'EM 2050', lvl), C('b', 500700, 'EM 2050', lvl), C('c', 502100, 'EM 2050', lvl)]); };
    eq('ordre 5 : seulement au niveau robuste', [i5('rob'), i5('std')], ['i5', '']);
    var t3 = function(ser, lvl){ return ty([C('a', 500000, ser, lvl), C('b', 500900, ser, lvl), C('c', 502300, ser, lvl), C('d', 503200, ser, lvl)]); };
    eq('trois émetteurs : selon la famille et le niveau', [t3('X', 'rob'), t3('AD', 'rob')], ['t3', '']);

    /* Un produit ne compte que si ses émetteurs sont dans la zone et dans le filtre de la liaison touchée */
    var far = function(ser){ return ty([C('a', 500000, ser, 'std'), C('b', 540000, ser, 'std'), C('c', 460000, ser, 'std')]); };
    eq('émetteur hors de la fenêtre du filtre : ignoré (UHF-R ±25 MHz), compté (ULX-D ±100 MHz)', [far('UHFR'), far('ULXD')], ['', 'i3']);
    var zn = function(zc){ return _rfCompat([{ id:'a', f:500000, z:'A', p:_rfProf({ ser:'AD' }, 'std') }, { id:'b', f:500400, z:'A', p:_rfProf({ ser:'AD' }, 'std') }, { id:'c', f:499650, z:zc, p:_rfProf({ ser:'AD' }, 'std') }]).list.length; };
    eq('intermodulation limitée à la zone', [zn('A') > 0, zn('B')], [true, 0]);
    var zc = [{ id:'a', f:500000, z:'A', p:_rfProf({ ser:'AD' }, 'std') }, { id:'b', f:500200, z:'B', p:_rfProf({ ser:'AD' }, 'std') }];
    eq('écart entre porteuses : entre toutes les zones, sauf zones isolées', [_rfCompat(zc).list.length, _rfCompat(zc, [['A', 'B']]).list.length], [1, 0]);

    /* 12. Calcul des fréquences */
    var N = function(n, o, ser, lvl){ var l = []; for(var q = 0; q < n; q++) l.push(Object.assign({ id:'c' + q, f:0, lo:470150, hi:636000, dir:'up', p:_rfProf({ ser:ser || 'AD' }, lvl || 'std') }, o || {})); return l; };
    var run = function(chs, opt){ var r = _rfCoord(chs, opt || {}), m = {}; r.list.forEach(function(x){ m[x.id] = x.f; }); r.fs = chs.filter(function(c){ return !c.fixed; }).map(function(c){ return m[c.id]; }); r.all = chs.map(function(c){ return { id:c.id, f:c.fixed ? c.f : m[c.id], p:c.p }; }).filter(function(c){ return c.f; }); return r; };
    var up = run(N(24));
    eq('24 AD standard, sens croissant', [up.placed, up.missed, up.fs[0], up.fs.every(function(f, q){ return !q || f > up.fs[q - 1]; })], [24, 0, 470150, true]);
    eq('résultat sans conflit (vérification indépendante)', _rfCompat(up.all).list, []);
    t('fréquences au pas de 25 kHz et dans la plage', up.fs.every(function(f){ return f % 25 === 0 && f >= 470150 && f <= 636000; }));
    var dn = run(N(24, { dir:'down' }));
    eq('sens décroissant : part du haut de la bande', [dn.placed, dn.fs[0], dn.fs.every(function(f, q){ return !q || f < dn.fs[q - 1]; }), _rfCompat(dn.all).list.length], [24, 636000, true, 0]);
    var mo = run(N(24, null, 'AD', 'more'));
    eq('AD « plus de fréquences » : simple pas de 350 kHz', [mo.fs[1] - mo.fs[0], mo.fs[23]], [350, 470150 + 23 * 350]);
    var rb = run(N(24, null, 'AD', 'rob'));
    eq('robuste : sans conflit et plus étalé que standard', [rb.placed, _rfCompat(rb.all).list.length, rb.fs[23] > up.fs[23], up.fs[23] > mo.fs[23]], [24, 0, true, true]);
    var mixL = N(12, null, 'AD', 'rob').concat(N(12, null, 'AD', 'more').map(function(c, q){ c.id = 'm' + q; return c; })), mx = run(mixL);
    eq('niveaux mélangés : chaque liaison protégée à son niveau', [mx.placed, _rfCompat(mx.all).list.length], [24, 0]);
    var mixD = N(12).map(function(c, q){ c.dir = q % 2 ? 'down' : 'up'; return c; }), md = run(mixD);
    eq('sens mélangés : les uns montent du bas, les autres descendent du haut', [md.fs[0], md.fs[1], md.fs[2] > md.fs[0], md.fs[3] < md.fs[1], _rfCompat(md.all).list.length], [470150, 636000, true, true, 0]);
    var av = run(N(6), { avoid:[[470000, 480000], [481000, 482000]] });
    t('plages à éviter respectées', av.fs.every(function(f){ return f > 480000 && !(f >= 481000 && f <= 482000); }) && av.fs[0] === 480025, av.fs);
    var inc = run(N(6), { include:[[500000, 502000], [600000, 601000]] });
    t('inclusions : rien en dehors', inc.placed === 6 && inc.fs.every(function(f){ return (f >= 500000 && f <= 502000) || (f >= 600000 && f <= 601000); }) && inc.fs[0] === 500000, inc.fs);
    var incEx = run(N(3), { include:[[500000, 502000]], avoid:[[500000, 500500]] });
    eq('une exclusion l\'emporte dans une inclusion', incEx.fs[0], 500525);
    var fx = run([{ id:'k1', f:470500, fixed:true, p:_rfProf({ ser:'AD' }, 'rob') }, { id:'k2', f:472000, fixed:true, p:_rfProf({ ser:'AD' }, 'rob') }].concat(N(10, null, 'AD', 'rob')));
    eq('fréquences gardées : intactes et protégées', [fx.list.length, fx.all[0].f, fx.all[1].f, _rfCompat(fx.all).list.length], [10, 470500, 472000, 0]);
    var tight = run(N(8, { lo:600000, hi:601500 }, 'PSM1000', 'std'));
